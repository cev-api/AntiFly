name: AntiFly
version: ${version}
main: com.antifly.paper.AntiFlyPlugin
api-version: '1.21'
folia-supported: true
commands:
  antifly:
    description: AntiFly administration
    usage: /antifly <help|enable|disable|status|alerts|debug|exempt|unexempt|set|reset>
    permission: antifly.admin
permissions:
  antifly.admin:
    description: Allows managing AntiFly
    default: op
  antifly.alerts:
    description: Receives AntiFly in-game violation alerts
    default: op
